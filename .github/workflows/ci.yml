name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    # TEMPORARY, for this PR only: which Node versions the 2023-era toolchain
    # (Vite 4.5, Vitest 0.34) actually still runs on. 24 is the current LTS,
    # 26 is Current. Collapses back to a single version before merge.
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24, 26]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      # `npm run test` starts vitest in watch mode and would hang the job.
      - name: Unit tests
        run: npx vitest run

      - name: Build
        run: npm run build

  # The engine, the plugin and the native test suite. This used to be verified
  # locally or not at all -- for a codebase that lives on one machine, that made
  # every C++ change a leap of faith. It builds without the ASIO SDK (Steinberg's
  # licence forbids redistributing it), which also proves the WASAPI fallback
  # path still compiles.
  native:
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # The bundle is embedded into the exe at configure time, so it has to
      # exist before CMake runs or the build silently falls back to the
      # "UI not built" page.
      - name: Build the frontend bundle
        working-directory: frontend
        run: |
          npm ci
          npm run build

      # JUCE and the NAM core are fetched at configure time; caching them keeps
      # the job from re-cloning several hundred megabytes on every push.
      #
      # build/webview2 must be cached alongside build/_deps, not instead of it.
      # The WebView2 NuGet package is declared with a SOURCE_DIR outside _deps,
      # but FetchContent's "already populated" stamps live *inside* it -- so
      # restoring _deps alone made configure skip the download while the headers
      # were absent, and the build died on a missing WebView2.h.
      - name: Cache fetched dependencies
        uses: actions/cache@v6
        with:
          path: |
            build/_deps
            build/webview2
          key: deps2-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: deps2-${{ runner.os }}-

      # The generator is deliberately not pinned. Locally this project uses
      # "Visual Studio 17 2022", but the windows-latest image has already moved
      # past it -- pinning it there failed with "could not find any instance of
      # Visual Studio". Letting CMake pick whichever MSVC the runner ships keeps
      # the job working across image bumps, and compiling against a newer
      # toolchain is a stricter check, not a weaker one.
      - name: Configure
        run: cmake -S . -B build

      - name: Build engine, plugin and tests
        run: cmake --build build --config Release --target MilodikFX MilodikFX_Plugin_VST3 MilodikFX_tests --parallel

      # Runs every statically-registered juce::UnitTest, including the DSP,
      # registry, MIDI, scene, channel, looper, modifier and NAM suites. The
      # performance tests assert build-independent ratios, so a slow CI runner
      # does not fail them.
      - name: Unit tests
        run: build\MilodikFX_tests_artefacts\Release\MilodikFX_tests.exe

      # Catches host-compatibility bugs the unit suite cannot see: state
      # round-trips, odd bus layouts, extreme block sizes, parameter access from
      # the wrong thread.
      - name: Validate the VST3 with pluginval
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/Tracktion/pluginval/releases/download/v1.0.3/pluginval_Windows.zip" -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          $vst3 = Get-ChildItem -Recurse -Filter "MilodikFX.vst3" -Path build\MilodikFX_Plugin_artefacts\Release\VST3 | Select-Object -First 1

          # Start-Process -Wait, not a bare call: pluginval is a GUI-subsystem
          # executable, and PowerShell does not wait for those. Calling it
          # directly returned instantly and left $LASTEXITCODE holding whatever
          # the previous command set -- the step "failed" 150 ms in, while
          # pluginval was still printing its first test.
          $proc = Start-Process -FilePath ".\pluginval\pluginval.exe" `
            -ArgumentList @("--strictness-level", "10",
                            "--validate-in-process",
                            "--timeout-ms", "600000",
                            "--validate", "`"$($vst3.FullName)`"") `
            -NoNewWindow -Wait -PassThru

          if ($proc.ExitCode -ne 0) { throw "pluginval reported failures (exit $($proc.ExitCode))" }

      - name: Upload the engine
        uses: actions/upload-artifact@v7
        with:
          name: MilodikFX-windows-x64
          path: |
            build/MilodikFX_artefacts/Release/MilodikFX.exe
            build/MilodikFX_Plugin_artefacts/Release/VST3/MilodikFX.vst3
          if-no-files-found: error
